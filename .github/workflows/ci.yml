name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Component tests on the three engines (WebKit is the most fragile for FACE and top layer).
      PRISM_TEST_BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run tokens:contrast
      - run: npm run build
      - run: npm test
      - run: npm run build-storybook
